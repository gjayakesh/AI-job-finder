<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B6B63">
<meta name="description" content="Personal AI career agent: live open roles from company career boards, match scores, tailored resumes, approvals, tracking and alerts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Career Agent">
<title>AI Career Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a working console. Fixed left rail for the 10 modules, a dense main column of cards and tables; state is encoded as pills and stripes. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#13201E; --muted:#5A6B68; --line:#D9E1DF; --accent:#0B6B63;
  --accent-ink:#FFFFFF; --accent-soft:#DDEFEC; --hi:#93540B; --hi-soft:#F7EAD7; --on-bad:#FFFFFF;
  --good:#176B3B; --good-soft:#DDF1E5; --warn:#7E5605; --warn-soft:#F6ECCF; --bad:#B23A28; --bad-soft:#F7E0DB; --info:#2F5E9E; --info-soft:#E0E9F6;
  --surface-2:#F7F9F8; --overlay:rgba(8,14,13,.45); --shadow:0 1px 2px rgba(19,32,30,.06),0 4px 14px rgba(19,32,30,.05); --shadow-2:0 2px 4px rgba(19,32,30,.05),0 14px 32px rgba(19,32,30,.11); color-scheme: light;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
/* Auto: follow the Claude app (data-theme) or the device setting */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#0D1413; --surface:#141D1B; --ink:#E4EDEB; --muted:#93A4A0; --line:#2A3835; --accent:#3BBFAE;
  --accent-ink:#06201C; --accent-soft:#163632; --hi:#E3A24F; --hi-soft:#3A2A14; --on-bad:#1B0A07;
  --good:#57C987; --good-soft:#163323; --warn:#E0B44A; --warn-soft:#352B12; --bad:#EE7B66; --bad-soft:#3A1C17; --info:#7FA9E6; --info-soft:#18263A;
  --surface-2:#18221F; --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --shadow-2:0 2px 6px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.42); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1413; --surface:#141D1B; --ink:#E4EDEB; --muted:#93A4A0; --line:#2A3835; --accent:#3BBFAE;
  --accent-ink:#06201C; --accent-soft:#163632; --hi:#E3A24F; --hi-soft:#3A2A14; --on-bad:#1B0A07;
  --good:#57C987; --good-soft:#163323; --warn:#E0B44A; --warn-soft:#352B12; --bad:#EE7B66; --bad-soft:#3A1C17; --info:#7FA9E6; --info-soft:#18263A;
  --surface-2:#18221F; --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --shadow-2:0 2px 6px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.42); color-scheme: dark;
}
/* Explicit choice from the in-app switcher wins over both */
:root[data-app-theme="light"]{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#13201E; --muted:#5A6B68; --line:#D9E1DF; --accent:#0B6B63;
  --accent-ink:#FFFFFF; --accent-soft:#DDEFEC; --hi:#93540B; --hi-soft:#F7EAD7; --on-bad:#FFFFFF;
  --good:#176B3B; --good-soft:#DDF1E5; --warn:#7E5605; --warn-soft:#F6ECCF; --bad:#B23A28; --bad-soft:#F7E0DB; --info:#2F5E9E; --info-soft:#E0E9F6;
  --surface-2:#F7F9F8; --overlay:rgba(8,14,13,.45); --shadow:0 1px 2px rgba(19,32,30,.06),0 4px 14px rgba(19,32,30,.05); --shadow-2:0 2px 4px rgba(19,32,30,.05),0 14px 32px rgba(19,32,30,.11); color-scheme: light;
}
:root[data-app-theme="dark"]{
  --bg:#0D1413; --surface:#141D1B; --ink:#E4EDEB; --muted:#93A4A0; --line:#2A3835; --accent:#3BBFAE;
  --accent-ink:#06201C; --accent-soft:#163632; --hi:#E3A24F; --hi-soft:#3A2A14; --on-bad:#1B0A07;
  --good:#57C987; --good-soft:#163323; --warn:#E0B44A; --warn-soft:#352B12; --bad:#EE7B66; --bad-soft:#3A1C17; --info:#7FA9E6; --info-soft:#18263A;
  --surface-2:#18221F; --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --shadow-2:0 2px 6px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.42); color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
#app{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;transition:background-color .2s,color .2s}
input,select,textarea,progress{accent-color:var(--accent)}
a{color:var(--accent);text-underline-offset:2px;text-decoration-thickness:1px}
::selection{background:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--ink)}
input,textarea{caret-color:var(--accent)}
::placeholder{color:var(--muted);opacity:1}
.main,.rail,.modal,.chat,.pre,.resume-doc,.notif-panel,.kanban,.tbl-wrap,.boards,.tabs{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 42%,transparent) transparent}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none!important}
.prose{max-width:72ch}
ul.plain{margin:6px 0;padding-left:18px}
summary{cursor:pointer}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:650;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px} h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--f-body);font-weight:600}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Reduce motion: nothing slides or grows; colour and opacity changes stay, and the loading spinner still turns. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-property:color,background-color,border-color,opacity,box-shadow!important;transition-duration:.12s!important}
  .spin,.flow-steps li.now .flow-dot{animation-duration:1.4s!important;animation-iteration-count:infinite!important}
  .rv{opacity:1!important;transform:none!important}
}

.shell{display:grid;grid-template-columns:236px 1fr;height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:750 14px var(--f-display)}
.brand b{font:700 15px var(--f-display);display:block}
.brand small{color:var(--muted);font-size:11px}
.nav{padding:4px 8px 16px;display:flex;flex-direction:column;gap:1px}
.nav h4{padding:14px 10px 4px;font-size:10.5px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13.5px;transition:background-color .12s,color .12s}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--hi-soft);color:var(--hi);border-radius:10px;padding:0 7px;font-weight:600}
.nav svg{width:16px;height:16px;flex:none;opacity:.8}
.rail-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.main{overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px;transition:box-shadow .2s}
.top.scrolled{box-shadow:0 10px 22px -18px rgba(19,32,30,.55)}
.scroll-prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;pointer-events:none}
.scroll-prog i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.skip{position:absolute;left:12px;top:-64px;z-index:80;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.skip:focus{top:12px}
.rail-shade{display:none}
.content:focus{outline:none}
.to-top{position:fixed;right:20px;bottom:20px;z-index:6;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-2);transition:transform .15s var(--ease),border-color .15s}
.to-top[hidden]{display:none}
.to-top:hover{border-color:var(--accent);transform:translateY(-2px)}
.to-top svg{width:18px;height:18px}
.top h1{font-size:20px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.icon-btn.menu-btn{display:none}
.content{padding:20px 24px 48px;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--hi-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--hi) 30%,transparent)}
.banner.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner .sp{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h .sp{flex:1}
.card-h p{color:var(--muted);font-size:12.5px}
.card.danger-zone{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.card.danger-zone h2{color:var(--bad)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.sp{flex:1}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn{transition:background-color .15s,border-color .15s,color .15s,filter .15s,transform .1s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn.ghost:hover{background:var(--surface-2);border-color:transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger:hover{border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.danger.solid:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{width:32px;height:32px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg svg{width:16px;height:16px}
.theme-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme-opt{border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink)}
.theme-opt[aria-pressed="true"]{border-color:var(--accent)}
.theme-swatch{height:54px;border-radius:7px;border:1px solid var(--line);display:grid;grid-template-columns:28% 1fr;overflow:hidden}
.theme-swatch i{display:block}
.icon-btn{position:relative;border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:17px;height:17px}
.icon-btn{transition:border-color .15s,transform .1s}
.icon-btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.icon-btn:active{transform:translateY(1px)}
.icon-btn.labeled span{display:none}
@media (min-width:641px){.icon-btn.labeled{width:auto;padding:0 12px 0 10px;gap:7px;display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap}.icon-btn.labeled span{display:inline}.icon-btn.labeled svg{color:var(--accent)}}
.dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.nodot::before{display:none}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.hi{background:var(--hi-soft);color:var(--hi);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;background:var(--surface-2)}
.chip.match{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.miss{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.pref{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:0}
.engine{font:500 10.5px var(--f-mono);padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.engine.ai{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);display:flex;flex-direction:column;gap:3px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:background-color .15s}
.stat:hover{background:var(--surface-2)}
.stat b{font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);line-height:1.3}

.tbl-wrap{overflow-x:auto;margin:0 -2px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}

.score{--v:0;--c:var(--accent);width:46px;height:46px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center}
.score::after{content:attr(data-v);width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 13px var(--f-display);font-variant-numeric:tabular-nums}
.score.lg{width:84px;height:84px}
.score.lg::after{width:68px;height:68px;font-size:24px}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.wrow{grid-template-columns:minmax(0,170px) minmax(0,1fr) 48px}
input[type=range]{min-width:0;width:100%}
.comp{display:grid;grid-template-columns:150px 1fr 44px 52px;gap:10px;align-items:center;font-size:12.5px}

.job-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .15s,box-shadow .2s,transform .2s var(--ease)}
.job-card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:var(--shadow);transform:translateY(-1px)}
.job-card:active{transform:none}
.job-card.closed h3{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.job-card h3{font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12.5px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;min-width:0}
label.f > span{color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=url],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:0;border-color:var(--accent)}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent)}
label.f > span.pw{position:relative;display:block;color:var(--ink)}
.pw input{padding-right:62px}
.pw-toggle{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:6px 10px;border-radius:6px}
.pw-toggle:hover{background:var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
.repeat{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
@media (pointer:coarse){.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}}
.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer;transition:color .12s,border-color .12s}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .cnt{display:inline-block;margin-left:4px;font-size:11px;background:var(--hi-soft);color:var(--hi);border-radius:10px;padding:0 7px;font-weight:600}
.page-tabs{margin-bottom:-2px}
.back{align-self:flex-start;font-size:13.5px;text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
details.more>summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details.more>summary b{color:var(--ink)}
details.more[open]>summary{color:var(--ink)}
details.card{gap:0}
details.card.more{padding-block:14px}

.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h4{display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.kcard{transition:border-color .15s,transform .15s var(--ease)}
.kcard:hover{border-color:var(--accent);transform:translateY(-1px)}

.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 14px 16px}

.resume-doc{background:#fff;color:#1a1a1a;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:28px 32px;font:13px/1.5 "IBM Plex Sans",Arial,sans-serif;max-height:680px;overflow:auto}
.resume-doc h2{font:700 20px Arial,sans-serif;color:#111;margin:0}
.resume-doc h3{font:700 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #ccc;padding-bottom:2px;margin:14px 0 6px;color:#222}
.resume-doc ul{margin:4px 0;padding-left:18px}
.resume-doc .kw{background:#FCEFD3}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pre{white-space:pre-wrap;font:12px/1.5 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:480px;overflow:auto}
.md{line-height:1.6}
.md h2,.md h3{margin:14px 0 6px}
.md ul{margin:4px 0;padding-left:20px}
.md p{margin:6px 0}

.chat{display:flex;flex-direction:column;gap:10px;min-height:340px;max-height:58vh;overflow-y:auto;padding:4px}
.msg{max-width:80%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a .md{white-space:normal}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.suggest button:hover{border-color:var(--accent);color:var(--accent)}

.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

.funnel{display:flex;flex-direction:column;gap:7px}
.frow{display:grid;grid-template-columns:minmax(84px,max-content) 1fr 54px;gap:10px;align-items:center;font-size:12.5px}
.frow .bar{height:18px;border-radius:5px}
.frow .bar i{border-radius:5px}
svg.chart text{fill:var(--muted);font:11px var(--f-body)}
svg.chart .grid-l{stroke:var(--line);stroke-width:1}

.modal-bg{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(720px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(1000px,100%)}
.toasts{position:fixed;bottom:72px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:13px;max-width:360px;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:var(--on-bad)}
.toast{animation:toast-in .26s var(--ease) both}
.modal-bg{animation:fade-in .18s ease-out both}
.modal{animation:modal-in .24s var(--ease) both}
.notif-panel{animation:modal-in .18s var(--ease) both}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}}
@keyframes fade-in{from{opacity:0}}
@keyframes modal-in{from{opacity:0;transform:translateY(8px)}}
.notif-panel{position:absolute;right:24px;top:58px;width:360px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.18);z-index:20;max-height:70vh;overflow:auto}
.notif{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:2px}
.notif.unread{background:var(--accent-soft)}
.busy{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:12.5px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font:650 16px var(--f-display)}
.empty > span{max-width:52ch}
.hash{font:500 11px var(--f-mono);color:var(--muted);word-break:break-all}
.stripe{background:var(--accent-soft);border-radius:8px;padding:9px 12px}
.stripe.good{background:var(--good-soft)} .stripe.warn{background:var(--warn-soft)} .stripe.bad{background:var(--bad-soft)} .stripe.info{background:var(--info-soft)}
.tick{color:var(--good);display:inline-grid;place-items:center;width:18px;height:20px;flex:none}
.tick svg{width:14px;height:14px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:8px;align-items:flex-start}
.qa{display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:6px 14px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:0}
.overlay-busy{position:fixed;inset:0;z-index:70;background:var(--overlay);display:grid;place-items:center}
.overlay-busy .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:300px;max-width:min(560px,92vw)}
.overlay-busy .stream{max-height:220px;overflow:auto;white-space:pre-wrap;font:12px/1.45 var(--f-mono);color:var(--muted)}


/* ---- first-run checklist ---- */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:2px}
.step:last-child{padding-bottom:2px}
.step > .stack{flex:1 1 220px}
.step-n{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 13px var(--f-body);font-variant-numeric:tabular-nums;border:1.5px solid var(--line);color:var(--muted)}
.step-n svg{width:14px;height:14px}
.step.next .step-n{border-color:var(--accent);color:var(--accent)}
.step.done .step-n{background:var(--good-soft);border-color:transparent;color:var(--good)}
.step.done b{color:var(--muted);font-weight:500}

/* ---- live search ---- */
.search-run{display:flex;flex-direction:column;gap:6px}
.bar.prog{height:6px;flex:none}
.bar.prog i{width:100%;transform-origin:left;transition:transform .35s var(--ease)}
.boards{display:flex;flex-wrap:wrap;gap:6px;max-height:216px;overflow-y:auto;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.board{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:2px 3px 2px 9px;font-size:12.5px;background:var(--surface)}
.board-x{border:0;background:transparent;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background-color .12s,color .12s}
.board-x:hover{background:var(--bad-soft);color:var(--bad)}
.board-x svg{width:12px;height:12px}
@media (pointer:coarse){.board-x{width:40px;height:40px}.board{padding-left:11px}}

/* ---- loading skeleton ---- */
.skeleton{display:flex;flex-direction:column;gap:16px}
.sk{border-radius:12px;border:1px solid var(--line);background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:220% 100%;animation:sk 1.5s linear infinite}
.sk-row{height:72px}.sk-card{height:132px}.sk-card.tall{height:280px}
@keyframes sk{to{background-position:-220% 0}}

/* ---- motion: a quick arrival when the page changes, then blocks rise in as you scroll to them ---- */
@property --v{syntax:'<number>';inherits:false;initial-value:0}
#app:not(.still) .content{animation:enter .26s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
.rv{opacity:0;transform:translateY(16px)}
.rv.rv-in{opacity:1;transform:none;transition:opacity .5s var(--ease) var(--rv-d,0ms),transform .6s var(--ease) var(--rv-d,0ms)}
#app:not(.still) .score{animation:ring .95s var(--ease) both}
#app:not(.still) .bar:not(.prog) i{transform-origin:left;animation:grow .75s var(--ease) both}
#app:not(.still) .rv:not(.rv-in) .score,#app:not(.still) .rv:not(.rv-in) .bar:not(.prog) i{animation:none}
@keyframes ring{from{--v:0}}
@keyframes grow{from{transform:scaleX(0)}}

/* ---- sign-in page ---- */
.landing{min-height:100%;max-width:1120px;margin:0 auto;padding:20px 24px 72px}
.landing-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0 36px}
.landing-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:64px;align-items:start}
.landing-story h1{font-size:clamp(28px,3.5vw,42px);line-height:1.08;letter-spacing:-.025em;max-width:19ch}
.lede{font-size:16px;line-height:1.55;color:var(--muted);max-width:54ch;margin-top:16px}
.pipe{list-style:none;margin:40px 0 0;padding:0}
.pipe-step{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:18px;padding-bottom:34px}
.pipe-step:last-child{padding-bottom:0}
.pipe-step:not(:last-child)::before,.pipe-step:not(:last-child)::after{content:"";position:absolute;left:15px;top:16px;bottom:-16px;width:2px}
.pipe-step::before{background:var(--line)}
.pipe-step::after{background:var(--accent);transform-origin:top;transform:scaleY(0);transition:transform .55s var(--ease)}
.pipe-step.through::after{transform:scaleY(1)}
.pipe-n{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line);color:var(--muted);font:600 13px var(--f-body);font-variant-numeric:tabular-nums;transition:background-color .3s,border-color .3s,color .3s}
.pipe-step h2{font-size:17px;line-height:32px;color:var(--muted);transition:color .3s}
.pipe-step p{color:var(--muted);max-width:50ch;line-height:1.55}
.pipe-step.on .pipe-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pipe-step.on h2{color:var(--ink)}
.auth-card{position:sticky;top:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-2)}
.auth-title{font-size:20px}
.auth-card a{cursor:pointer}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .25s var(--ease)}
  .rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open + .rail-shade{display:block;position:fixed;inset:0;z-index:39;background:var(--overlay)}
  .landing-grid{grid-template-columns:1fr;gap:36px}
  .auth-card{position:static;order:-1}
  .landing{padding:16px 16px 56px}
  .landing-top{padding-bottom:20px}
  .icon-btn.menu-btn{display:grid}
  .g2,.g3{grid-template-columns:1fr}
  .content{padding:16px 16px 40px}
  .top{padding:10px 16px}
  .diff{grid-template-columns:1fr}
  .comp{grid-template-columns:110px 1fr 36px 44px}
  .comp.wrow{grid-template-columns:minmax(0,130px) minmax(0,1fr) 44px}
}
/* Touch screens: controls large enough to hit, and 16px inputs so phones don't zoom in on focus. */
@media (pointer:coarse){
  .btn{min-height:44px;padding-inline:14px}
  .btn.sm{min-height:40px}
  .icon-btn,.seg button{width:44px;height:44px}
  .nav a{min-height:44px}
  .tabs a{padding-block:12px}
  .suggest button{min-height:40px;padding-inline:14px}
  .check{min-height:36px}
  .pw-toggle{min-height:40px;min-width:52px}
  summary{padding-block:6px;margin-block:-6px}   /* a taller tap area for the one-line "show more" rows, without moving anything */
  details.more>summary{padding-block:12px;margin-block:-12px}   /* cards have room for more */
  .to-top{width:46px;height:46px}
  input[type=text],input[type=email],input[type=password],input[type=tel],input[type=url],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=search],select,textarea{font-size:16px;min-height:44px}
}
@media (max-width:520px){body{font-size:16px}.small{font-size:14px}.meta{font-size:14px}.top .seg{display:none}.top h1{font-size:18px}.theme-opts{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:1fr}.toasts{left:16px;right:16px}.job-card{grid-template-columns:auto 1fr}.job-card > :last-child{grid-column:1/-1}.qa{grid-template-columns:1fr}.frow{grid-template-columns:100px 1fr 54px}}

/* ---- First-visit guidance: start card, setup window, resume check, help, sign-in switch ---- */
.hero-start{gap:18px;padding:24px 26px;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.hero-start h2{font-size:clamp(22px,3vw,28px);line-height:1.15}
.hero-start .prose{font-size:15.5px;line-height:1.55;margin:0}
.drop.big{padding:36px 20px;gap:10px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft)}
.drop.big svg{width:32px;height:32px;color:var(--accent)}
.drop.big b{font-size:17px}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.what-next{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.what-next li{display:flex;gap:12px;align-items:flex-start;line-height:1.5}
.what-next li>b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 13px var(--f-body)}
.page-help{margin:0;color:var(--muted);font-size:14px;max-width:72ch;line-height:1.5}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tip{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.tip:first-child{border-top:0;padding-top:2px}
.tip p{margin:0;line-height:1.5}
.tip .ex{margin:0;padding-left:18px;color:var(--muted)}
.draft{margin:0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.5}
.gloss{display:grid;gap:10px;margin:0}
.gloss>div{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:12px}
.gloss dt{font-weight:600}
.gloss dd{margin:0;color:var(--muted);line-height:1.5}
.faq{border-top:1px solid var(--line);padding-top:10px}
.faq:first-child{border-top:0;padding-top:0}
.faq summary{cursor:pointer}
.faq p{margin:6px 0 0}
.flow{min-width:min(420px,92vw)}
.flow-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.flow-steps li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.flow-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;box-sizing:border-box}
.flow-steps li.now{color:var(--ink);font-weight:600}
.flow-steps li.now .flow-dot{border-color:var(--accent);border-top-color:transparent;animation:sp .8s linear infinite}
.flow-steps li.done{color:var(--ink)}
.flow-steps li.done .flow-dot{background:var(--good);border-color:var(--good)}
.flow-steps li.done .flow-dot::after{content:"";width:4px;height:8px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.flow-note{min-height:1.4em;margin:0}
.auth-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
.auth-switch a{text-align:center;padding:10px 8px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.auth-switch a.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
@media (max-width:600px){.gloss>div{grid-template-columns:1fr;gap:2px}.hero-start{padding:18px}}

  const list = skills.length > 1 ? `${skills.slice(0, -1).join(', ')} and ${skills[skills.length - 1]}` : skills[0] || '';

  const pr = (p.projects || []).filter(x => x.name);
  const ex = (p.experiences || []).find(e => e.role && e.employer);
  if (pr.length) out.push(pr.length === 1 ? `Built a project: ${pr[0].name}.` : `Built ${pr.length} projects, including ${pr[0].name}.`);
  else if (ex) out.push(`Worked as ${ex.role} at ${ex.employer}.`);

  if (yrs < 1 && ed && ed.degree) out.push(`Holds a ${ed.degree}${ed.institution ? ' from ' + ed.institution : ''}.`);

V.profile = () => {

  const filled = [p.name, p.email, p.phone, p.location, (p.skills || []).length, (p.education || []).length, (p.projects || []).length || (p.experiences || []).length, p.noticePeriod, p.expectedMin || (S.prefs && S.prefs.salaryMin)].filter(Boolean).length;
  const compl = Math.round(filled / 9 * 100);
  const inp = (n, l, v, t = 'text', ex = '') => `<label class="f"><span>${l}</span><input type="${t}" id="pf-${n}" name="${n}" value="${esc(v ?? '')}" ${ex}></label>`;
  const rows = (kind, arr, fields) => `<div class="stack" id="rep-${kind}">${(arr || []).map((it, i) => `<div class="repeat"><div class="fgrid">${fields.map(([f, l, t]) => t === 'area' ? `<label class="f wide"><span>${l}</span><textarea id="pf-${kind}-${i}-${f}" name="${kind}.${i}.${f}" rows="3">${esc(it[f] || '')}</textarea></label>` : `<label class="f"><span>${l}</span><input type="${t || 'text'}" id="pf-${kind}-${i}-${f}" name="${kind}.${i}.${f}" value="${esc(it[f] || '')}"></label>`).join('')}</div><div class="row"><span class="sp"></span><button class="btn sm danger" type="button" data-act="pf-del" data-kind="${kind}" data-i="${i}">Remove</button></div></div>`).join('')}<button class="btn sm" type="button" data-act="pf-add" data-kind="${kind}">+ Add ${kind === 'experiences' ? 'experience or internship' : kind.replace(/s$/, '')}</button></div>`;
  const wm = p.workModes || [];
  const et = p.employmentTypes || ['full_time'];
  return `<form novalidate class="stack" style="gap:16px" data-form="profile" id="profile-form">
  <div class="card"><div class="card-h"><h2>Career profile</h2><span class="pill ${compl >= 80 ? 'good' : 'warn'}">${compl}% complete</span><span class="sp"></span><button class="btn primary" type="submit">Save profile</button></div>
  <p class="muted small">Tailored resumes and application answers use only what is written here. Your original resume file is kept unchanged on the Resume tab.</p></div>
  <div class="card"><h3>Contact</h3><div class="fgrid">${inp('name', 'Full name', p.name)}${inp('email', 'Email', p.email, 'email')}${inp('phone', 'Phone', p.phone, 'tel')}${inp('location', 'Current city', p.location)}${inp('linkedin', 'LinkedIn URL', p.linkedin, 'text', 'inputmode="url"')}${inp('github', 'GitHub URL', p.github, 'text', 'inputmode="url"')}${inp('portfolio', 'Portfolio URL', p.portfolio, 'text', 'inputmode="url"')}</div></div>
  <div class="card"><h3>Summary and level</h3><label class="f"><span>Professional summary</span><textarea id="pf-summary" name="summary" rows="3">${esc(p.summary)}</textarea></label>
  <div class="fgrid"><label class="f"><span>Experience level</span><select id="pf-level" name="experienceLevel">${['Fresher', 'Junior (1–3 yrs)', 'Mid-level (3–6 yrs)', 'Senior (6+ yrs)'].map(o => `<option ${p.experienceLevel === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>${inp('totalYears', 'Full-time experience (years)', p.totalYears, 'number', 'step="0.1" min="0"')}${inp('noticePeriod', 'Notice period', p.noticePeriod, 'text', 'placeholder="Immediate / 30 days"')}${inp('currentCtc', 'Current CTC (₹ per year, optional)', p.currentCtc, 'number', 'min="0" step="10000"')}${inp('expectedMinL', 'Expected salary from (LPA)', p.expectedMin != null ? lpaNum(p.expectedMin) : '', 'number', 'step="0.5" min="0"')}${inp('expectedMaxL', 'Expected salary to (LPA)', p.expectedMax != null ? lpaNum(p.expectedMax) : '', 'number', 'step="0.5" min="0"')}${inp('workAuth', 'Authorised to work in India?', p.workAuth, 'text', 'placeholder="Yes"')}</div></div>
  <div class="card"><h3>Job targets</h3><div class="fgrid">${inp('preferredRoles', 'Preferred roles (comma separated)', (p.preferredRoles || []).join(', '))}${inp('preferredLocations', 'Preferred locations', p.preferredLocations || '')}
  <div class="f"><span class="muted" style="font-size:12.5px">Work modes</span><div class="row">${['remote', 'hybrid', 'onsite'].map(m => `<label class="check"><input type="checkbox" name="workModes" value="${m}" ${wm.includes(m) ? 'checked' : ''}>${m[0].toUpperCase() + m.slice(1)}</label>`).join('')}</div></div>
  <div class="f"><span class="muted" style="font-size:12.5px">Employment types</span><div class="row">${Object.entries(EMP_LABEL).map(([k, l]) => `<label class="check"><input type="checkbox" name="employmentTypes" value="${k}" ${et.includes(k) ? 'checked' : ''}>${l}</label>`).join('')}</div></div>
  <label class="check"><input type="checkbox" name="relocate" value="1" ${p.relocate ? 'checked' : ''}>Open to relocating</label></div></div>
  <div class="card"><h3>Skills</h3><label class="f"><span>Technical skills, languages, frameworks, tools (comma separated)</span><textarea id="pf-skills" name="skills" rows="3">${esc((p.skills || []).join(', '))}</textarea></label>${(p.skills || []).length ? `<div class="chips">${p.skills.map(s => `<span class="chip">${esc(s)} <span class="tiny muted">${esc(skillCat(s))}</span></span>`).join('')}</div>` : ''}</div>
  <div class="card"><h3>Projects</h3>${rows('projects', p.projects, [['name', 'Project name'], ['technologies', 'Technologies'], ['link', 'Link'], ['description', 'What you built and how', 'area']])}</div>
  <div class="card"><h3>Experience and internships</h3>${rows('experiences', p.experiences, [['role', 'Role'], ['employer', 'Employer'], ['start', 'Start (YYYY-MM)'], ['end', 'End (YYYY-MM, blank = current)'], ['description', 'Responsibilities and results', 'area']])}</div>
  <div class="card"><h3>Education</h3>${rows('education', p.education, [['degree', 'Degree'], ['institution', 'Institution'], ['year', 'Year'], ['score', 'CGPA / %']])}</div>
  <div class="card"><div class="grid g2"><label class="f"><span>Certifications (one per line)</span><textarea id="pf-certs" name="certifications" rows="4">${esc((p.certifications || []).join('\n'))}</textarea></label><label class="f"><span>Achievements (one per line)</span><textarea id="pf-ach" name="achievements" rows="4">${esc((p.achievements || []).join('\n'))}</textarea></label></div>
  <div class="row"><span class="sp"></span><button class="btn primary" type="submit">Save profile</button></div></div></form>`;
};

V.resumes = () => {

  <details><summary class="small muted" style="cursor:pointer">Or paste resume text</summary><form novalidate class="stack" data-form="paste-resume" style="margin-top:8px"><textarea name="text" id="paste-resume" aria-label="Resume text" rows="6" placeholder="Paste the full text of your resume"></textarea><div class="row"><button class="btn" type="submit">Read pasted text</button></div></form></details></div>
  <div class="card"><div class="card-h"><h2>Your uploaded resumes</h2></div>${R.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>File</th><th>Uploaded</th><th>Type</th><th></th></tr></thead><tbody>${R.map(r => `<tr><td>${esc(r.filename)}</td><td>${fmtDT(r.uploadedAt)}</td><td>${esc(r.kind.toUpperCase())}</td><td class="r" style="white-space:nowrap"><button class="btn sm" type="button" data-act="view-original" data-id="${r.id}">View text</button> <button class="btn sm" type="button" data-act="reparse" data-id="${r.id}" title="Read this resume again and use it for My details">Use for my details</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No resume uploaded yet.</p>'}</div>
  <div class="card"><div class="card-h"><h2>Tailored resumes</h2><p>One per job. Older versions stay available.</p></div>${Vs.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Job</th><th>Version</th><th class="r" title="The share of the job’s keywords your resume contains">Keyword match</th><th>Made by</th><th>Created</th><th></th></tr></thead><tbody>${Vs.map(v => { const j = S.jobs[v.jobId]; return `<tr><td>${j ? `<a href="#job-${j.id}">${esc(j.title)} · ${esc(j.company)}</a>` : '<span class="muted">Deleted job</span>'}</td><td class="num">v${v.version}</td><td class="r num">${v.coverage}%</td><td>${engineTag(v.engine)}</td><td>${fmtDT(v.createdAt)}</td><td class="r" style="white-space:nowrap"><button class="btn sm" type="button" data-act="preview-version" data-id="${v.id}">Preview</button> <button class="btn sm" type="button" data-act="compare-version" data-id="${v.id}">Compare</button> <button class="btn sm" type="button" data-act="dl-pdf" data-id="${v.id}">PDF</button> <button class="btn sm" type="button" data-act="dl-docx" data-id="${v.id}">DOCX</button></td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted">None yet. Open a job and press “Prepare application” to make one.</p>'}</div>`;
};

const tipItem = x => `<li class="tip ${x.level}"><div class="row"><span class="pill ${x.level === 'fix' ? 'bad' : 'warn'}">${x.level === 'fix' ? 'Fix first' : 'Improve'}</span><b>${esc(x.title)}</b></div><p class="small">${esc(x.why)}</p><p class="small"><b>How:</b> ${esc(x.how)}</p>${x.examples && x.examples.length ? `<ul class="small ex">${x.examples.map(e => `<li>“${esc(e)}”</li>`).join('')}</ul>` : ''}${x.fix && x.fix.text ? `<blockquote class="draft">${esc(x.fix.text)}</blockquote>` : ''}${x.fix || x.go ? `<div class="row">${x.fix ? `<button class="btn sm primary" type="button" data-act="${x.fix.act}" data-text="${esc(x.fix.text)}">${esc(x.fix.label)}</button>` : ''}${x.go ? `<a class="btn sm" href="#${x.go}">${esc(x.goLabel || 'Open')}</a>` : ''}</div>` : ''}</li>`;
V.resumecheck = () => {
  const rv = currentReview();
  if (!rv) return `<div class="card">${emptyState('No resume to check yet', 'Upload your resume and we will tell you what to improve, in plain words.', '<a class="btn primary" href="#resumes">Upload my resume</a>')}</div>`;
  const todo = rv.items.filter(x => x.level !== 'good'), ok = rv.items.filter(x => x.level === 'good');
  const col = { good: 'var(--good)', warn: 'var(--warn)', bad: 'var(--bad)' }[reviewTone(rv.score)];
  return `<div class="card"><div class="row" style="gap:16px;align-items:flex-start"><div class="score lg" style="--v:${rv.score};--c:${col}" data-v="${rv.score}" role="img" aria-label="Resume score ${rv.score} out of 100"></div>
  <div class="stack" style="gap:6px;flex:1;min-width:220px"><h2>Your resume: ${esc(rv.label)}</h2><p class="small muted prose">${todo.length ? `We found ${todo.length} thing${todo.length === 1 ? '' : 's'} to improve. Start at the top: the first ones help the most.` : 'Nothing to fix. Nice work.'} This check only reads your resume. We never add skills or experience you did not write.</p></div>
  <div class="stack" style="gap:6px"><button class="btn" type="button" data-act="dl-my-pdf">${icon('dl')}Download clean copy (PDF)</button><button class="btn" type="button" data-act="dl-my-docx">${icon('dl')}Download clean copy (Word)</button></div></div>
  <p class="tiny muted">The clean copy is built from <a href="#profile">My details</a>, so fix details there first. To change the original file, edit it in Word or Google Docs and upload it again on the <a href="#resumes">Resume</a> tab.</p></div>
  ${todo.length ? `<div class="card"><div class="card-h"><h2>What to improve</h2></div><ol class="tips">${todo.map(tipItem).join('')}</ol></div>` : ''}
  ${rv.gaps.length ? `<div class="card"><h2>Skills your matching jobs ask for</h2><p class="small muted prose">These appear in jobs we found for you but not on your resume. If you really have a skill, add it. If you do not, treat it as something to learn. Only add what is true.</p><div class="chips">${rv.gaps.map(g => `<span class="chip pref">${esc(g.skill)} <span class="tiny">${g.count} of ${g.of} jobs</span></span>`).join('')}</div><div class="row"><a class="btn sm" href="#profile">Add skills in My details</a></div></div>` : ''}
  <div class="card"><h2>Next: tailor it for a job</h2><p class="small muted prose">Open any job in <a href="#jobs">Jobs for you</a> and press “Prepare application”. We rewrite your resume to highlight what that job asks for, using only facts from your profile. You approve it before anything is sent.</p></div>
  ${ok.length ? `<details class="card more"><summary><b>What is already good (${ok.length})</b></summary><ul class="list small" style="margin-top:8px">${ok.map(x => `<li><span class="pill good nodot">✓</span><span>${esc(x.title)}</span></li>`).join('')}</ul></details>` : ''}`;
};

  <div class="card"><h2>Where to find things</h2><p class="small muted">The menu on the left has six sections. Help and Ask AI are at the top of every page.</p><dl class="gloss">${map.map(([w, d]) => `<div><dt>${esc(w)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl></div>
  <div class="card"><h2>Common questions</h2><div class="stack">${faq.map(([q, a, href, linkText]) => `<details class="faq"><summary><b>${esc(q)}</b></summary><p class="small prose">${esc(a)}${href ? ` <a href="${href}">${esc(linkText)}</a>` : ''}</p></details>`).join('')}</div></div>

V.preferences = () => {

  ${isDraft ? `<div class="banner info"><b>Check these filters.</b><span>They are not saved until you confirm.</span><span class="sp"></span><button class="btn sm" type="button" data-act="prefs-discard">Discard</button><button class="btn sm primary" type="button" data-act="prefs-confirm">Confirm and save</button></div>` : ''}

  <div class="fgrid">
  <label class="f wide"><span>Job titles</span><input type="text" name="titles" id="pr-titles" value="${esc((p.titles || []).join(', '))}"></label>

  <div class="f wide"><span class="muted" style="font-size:12.5px">Employment type</span><div class="row">${Object.entries(EMP_LABEL).map(([k, l]) => `<label class="check"><input type="checkbox" name="employmentTypes" value="${k}" ${(p.employmentTypes || []).includes(k) ? 'checked' : ''}>${l}</label>`).join('')}</div></div></div>

  <label class="f wide"><span>Other requirements</span><input type="text" name="other" id="pr-other" value="${esc(p.other || '')}"></label></div></details></form>`;

V.discover = () => {
  const n = S.notify || DEFAULT_NOTIFY(); const p = S.prefs || {}; const boards = boardsFor(n);
  const hasPrefs = (p.titles || []).length > 0; const st = (S.server && S.server.status) || null; const src = (st && st.sources) || {};
  const links = discoveryLinks(S.prefs); const J = Object.values(S.jobs);
  const jobsFrom = { boards: J.filter(j => ATS_NAME[j.source]).length, remote: J.filter(j => REMOTE_NAME[j.source]).length };
  const remoteOn = Object.keys(REMOTE_NAME).some(k => n.feeds[k] !== false);
  const live = id => id === 'boards' ? (n.feeds.ats === false ? 'Off' : 'Connected') : id === 'remote' ? (remoteOn ? 'Connected' : 'Off') : id === 'adzuna' ? (/^ok/.test(src.adzuna || '') ? 'Connected' : 'Needs setup') : null;
  const tone = v => v === 'Connected' ? 'good' : v === 'Limited' || v === 'Needs setup' ? 'info' : v === 'Manual' ? 'warn' : '';
  const stale = st && st.lastRunAt && (Date.now() - new Date(st.lastRunAt)) > 3 * 3600e3;
  return `<section class="card"><div class="card-h"><h2>Companies searched</h2><p>${boards.length} career page${boards.length === 1 ? '' : 's'}</p><span class="sp"></span>${(n.boardsOff || []).length ? `<button class="btn sm" type="button" data-act="boards-restore">Restore ${n.boardsOff.length} removed</button>` : ''}</div>

V.jobs = () => {

  const all = J.length;
  if (f.status !== 'all') J = J.filter(j => f.status === 'open' ? !['Archived', 'EmployerRejected', 'Withdrawn', 'OfferDeclined', 'RejectedByUser'].includes(j.stage) && !(isClosed(j) && stillPreparing(j)) : f.status === 'closed' ? isClosed(j) : j.stage === f.status);

V.job = id => {
  const j = S.jobs[id]; if (!j) return `<div class="card">${emptyState('Job not found', 'It may have been deleted.', '<a class="btn" href="#jobs">Back to jobs</a>')}</div>`;
  const m = j.match || {}; const tab = S.ui.tab[id] || 'match'; const v = S.versions[j.app && j.app.versionId];

  if (j.stage === 'Shortlisted') actions.push(`<button class="btn primary" type="button" data-act="tailor" data-id="${j.id}">Generate tailored resume</button>`);
  if (j.stage === 'ResumeGenerated') actions.push(`<button class="btn primary" type="button" data-act="prepare" data-id="${j.id}">Prepare application</button>`, `<button class="btn" type="button" data-act="tailor" data-id="${j.id}">Regenerate resume</button>`);
  if (j.stage === 'AwaitingApproval') actions.push(`<a class="btn primary" href="#approvals">Review and approve</a>`);

  if (j.stage === 'SubmissionInProgress') actions.push(`<button class="btn primary" type="button" data-act="submit" data-id="${j.id}">Record submission result</button>`);

  if (['Discovered', 'Analyzed', 'Shortlisted', 'ResumeGenerated', 'RejectedByUser'].includes(j.stage)) actions.push(`<button class="btn" type="button" data-act="stage" data-id="${j.id}" data-to="Archived" title="Hide this job from your list. You can bring it back later">Archive</button>`);

  return `<div class="card"><div class="row" style="gap:16px;align-items:flex-start">${scoreRing(m.score, true)}<div class="stack" style="gap:6px;flex:1;min-width:220px"><div class="row"><h2 style="font-size:21px">${esc(j.title)}</h2>${['Discovered', 'Analyzed'].includes(j.stage) ? '' : stagePill(j.stage)}${closedPill(j)}</div>${jobMeta(j)}
  <div class="row small"><span class="pill ${category(m.score || 0).tone}">${esc(m.category || 'Not scored')}</span>${j.applyUrl ? `<a href="${esc(j.applyUrl)}" target="_blank" rel="noopener noreferrer">Official posting ${icon('ext', 'style="width:12px;height:12px;vertical-align:-1px"')}</a>` : '<span class="muted">No application URL</span>'}${j.deadline ? `<span class="muted">Apply by ${fmtDate(j.deadline)}</span>` : ''}${ATS_NAME[j.source] && !j.closed ? `<span class="muted">${j.verifiedOpenAt ? `Listed as open ${esc(relTime(j.verifiedOpenAt))}` : 'Not checked yet'}</span><button class="btn sm ghost" type="button" data-act="verify-open" data-id="${j.id}">${icon('refresh')}Check now</button>` : ''}</div></div>

  <nav class="tabs" aria-label="Job sections">${tabs.map(([k, l]) => `<a data-act="tab" data-id="${j.id}" data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}</a>`).join('')}</nav>${body}`;

function matchTab(j) {
  const m = j.match; if (!m) return `<div class="card">${emptyState('Not scored yet', 'Score this job against your profile.', `<button class="btn primary" type="button" data-act="score" data-id="${j.id}">Score now</button>`)}</div>`;
  const W = m.weights || S.settings.weights; const wsum = sum(Object.values(W).map(Number)) || 1;
  return `<div class="grid g-side"><div class="card"><div class="card-h"><h2>Score breakdown</h2>${engineTag(m.engine)}</div>
  <p class="small muted">Each line shows how well you fit one part of the job, out of 100, and the points it adds to your total.</p>
  <div class="stack">${Object.entries(COMP_LABEL).map(([k, l]) => { const c = m.components[k]; return `<div class="comp"><span>${l} <span class="tiny muted">${Math.round(W[k] / wsum * 100)}%</span></span><div class="bar"><i style="width:${c.v}%;${c.v < 50 ? 'background:var(--bad)' : c.v < 70 ? 'background:var(--warn)' : ''}"></i></div><b class="num" style="text-align:right">${c.v}</b><span class="tiny muted num" style="text-align:right">+${Math.round(W[k] * c.v / wsum * 10) / 10}</span></div><div class="tiny muted" style="margin:-6px 0 2px">${esc(c.note)}${c.unknown ? ' · <i>missing info, scored neutral</i>' : ''}</div>`; }).join('')}</div>
  <p class="small"><b>Recommendation:</b> ${esc(m.recommendation)}</p>${m.ai ? `<div class="stripe info small"><b>AI review</b> ${engineTag('ai')}<div class="md">${mdHTML(m.ai)}</div></div>` : AI.available() ? `<div class="row"><button class="btn sm" type="button" data-act="ai-explain" data-id="${j.id}">Ask ${AI.name} for a semantic review</button><span class="tiny muted">Optional; the score itself stays deterministic.</span></div>` : '<p class="tiny muted">Add a free Gemini key in <a href="#config">Settings</a> for an optional AI review.</p>'}</div>
  <div class="stack" style="gap:16px"><div class="card"><h3>Required skills</h3>${chipList(m.matchedRequired, 'match')}${m.missingRequired.length ? chipList(m.missingRequired, 'miss') : ''}${((m.matchedRequired || []).length || m.missingRequired.length) ? '<p class="tiny muted">Green skills are on your resume. Red ones are not.</p>' : ''}<h3>Preferred skills</h3>${chipList(m.matchedPreferred, 'match')}${m.missingPreferred.length ? `<div class="chips">${m.missingPreferred.map(s => `<span class="chip pref">${esc(s)}</span>`).join('')}</div><p class="tiny muted">Missing preferred skills lower the score slightly but never disqualify a job.</p>` : ''}</div>
  <div class="card"><h3>Strengths</h3>${m.strengths.length ? `<ul class="list small">${m.strengths.map(s => `<li><span class="pill good nodot">+</span><span>${esc(s)}</span></li>`).join('')}</ul>` : '<p class="muted small">None identified.</p>'}<h3>Weaknesses</h3>${m.weaknesses.length ? `<ul class="list small">${m.weaknesses.map(s => `<li><span class="pill bad nodot">−</span><span>${esc(s)}</span></li>`).join('')}</ul>` : '<p class="muted small">None identified.</p>'}${m.unknowns.length ? `<h3>Not enough information</h3><ul class="list small">${m.unknowns.map(s => `<li><span class="pill nodot">?</span><span>${esc(s)}</span></li>`).join('')}</ul>` : ''}</div>
  <div class="card"><h3>Relevant projects</h3>${m.projects.length ? hbars(m.projects.map(x => ({ label: x.name, value: x.rel, text: x.rel + '%' })), { max: 100 }) : '<p class="muted small">No projects in profile.</p>'}</div></div></div>`;
}
function resumeTab(j, v) {

  <div class="card"><h3>Fact check</h3>${v.content.guard.length ? `<p class="tiny muted">Left out because your profile does not support them:</p><ul class="list small">${v.content.guard.map(g => `<li><span class="pill warn nodot">!</span><span>${esc(g)}</span></li>`).join('')}</ul>` : '<p class="small"><span class="pill good">Passed</span> Every skill, project, employer and date comes from your profile.</p>'}</div>
  <div class="card"><h3>Keywords</h3><p class="tiny muted">In the resume</p>${chipList(v.keywordsCovered, 'match')}<p class="tiny muted">Not in the resume (and not added, because your profile lacks them)</p>${chipList(v.keywordsMissing, 'miss')}</div>

  ${['ResumeGenerated', 'Shortlisted', 'AwaitingApproval', 'Approved'].includes(j.stage) ? `<button class="btn" type="button" data-act="tailor" data-id="${j.id}">Regenerate</button>` : ''}</div></div>`;
}

function timelineTab(j) {

  if (j.stage === 'Discovered') moveStage(j, 'Analyzed', { by, note: `Score ${j.match.score} (${j.match.category})`, silent: true }); else save.job(j);

function rescoreAll() {

async function runWorkflow(j, { local = false } = {}) {
  if (!ensureProfile() || !ensureOpen(j)) return false;
  if (j.stage === 'Discovered') scoreAndStore(j);
  if (!j.match) j.match = scoreJob(j, S.profile, S.prefs, S.settings.weights);
  if (j.stage === 'Analyzed') moveStage(j, 'Shortlisted', { by: 'Application Agent', note: 'Selected for application', silent: true });
  if (j.stage === 'Shortlisted') { const v = await tailorResume(j, { forceLocal: local }); j.app = j.app || {}; j.app.versionId = v.id; moveStage(j, 'ResumeGenerated', { by: 'Resume Optimization Agent', note: `v${v.version}, keyword match ${v.coverage}%`, silent: true }); }
  if (j.stage === 'ResumeGenerated') { await prepareApplication(j); moveStage(j, 'AwaitingApproval', { by: 'Application Agent', note: 'Stopped for your approval' }); }
  return true;
}
async function answerExtra(j, qs) {
  const p = S.profile;
  const prompt = `Answer job application questions ONLY from the verified candidate profile below. If the profile does not contain the answer, return an empty answer and needs_input true. Never invent facts, numbers, dates or skills.
${UNTRUSTED}
Profile: ${JSON.stringify({ name: p.name, location: p.location, totalYears: candidateYears(p), skills: profileSkillNames(p), experiences: p.experiences, projects: p.projects, education: p.education, noticePeriod: p.noticePeriod, relocate: p.relocate })}
Questions: <untrusted>${JSON.stringify(qs)}</untrusted>

  const localAns = q => { const sk = detectSkills(q); const have = lcSet(profileSkillNames(p)); if (sk.length && /experience|worked|know|familiar|used/i.test(q)) { const yes = sk.filter(s => have.has(s.toLowerCase())); const no = sk.filter(s => !have.has(s.toLowerCase())); if (!no.length) { const pj = (p.projects || []).find(x => yes.some(s => splitList(x.technologies).map(canonSkill).includes(s))); return { question: q, answer: `Yes. ${yes.join(', ')} ${pj ? `— used in my project ${pj.name}` : 'is listed in my skills'}.`, evidence: pj ? 'Profile › Projects' : 'Profile › Skills', needs_input: false }; } } return { question: q, answer: '', evidence: '', needs_input: true }; };
  const { out, engine } = await AI.route({ personal: true, label: 'Answering employer questions…', prompt, validate: o => Array.isArray(o), local: async () => qs.map(localAns) });
  out.forEach((o, i) => j.app.answers.push({ id: uid('q'), key: 'custom', q: String(o.question || qs[i]), a: String(o.answer || ''), evidence: o.answer ? `${engine === 'ai' ? AI.name : 'Local engine'} from ${o.evidence || 'profile'} — review` : '', needsInput: !!o.needs_input || !o.answer, required: true, draft: true }));

}

const REMOTE_GAP_MS = 6 * 3600e3;   // the remote job feeds ask not to be polled often
function searchLabel(run) {

  if (run.phase === 'remote') return 'Checking remote job feeds…';
  return `Reading company career pages${run.board ? ' · ' + run.board.name : ''}…`;
}
function paintSearchProgress() {
  const run = S.ui.searching; if (!run) return;
  const bar = $('#search-bar'), label = $('#search-label'), count = $('#search-count');
  if (bar) bar.style.transform = `scaleX(${run.total ? Math.max(0.02, run.done / run.total) : 0.02})`;

/** Searches the live job boards from this browser, adds new matches and flags saved roles that have closed. */
async function runLiveSearch({ quiet = false } = {}) {
  if (S.ui.searching) return null;
  if (!S.prefs || !(S.prefs.titles || []).length) { toast('Say what job you want first, so the search knows what to look for.', 'bad'); go('preferences'); return null; }
  const n = S.notify || DEFAULT_NOTIFY(); const boards = n.feeds.ats === false ? [] : boardsFor(n);
  const last = { ...((S.meta && S.meta.remoteAt) || {}) };
  const due = k => !last[k] || Date.now() - new Date(last[k]) > REMOTE_GAP_MS;
  const remote = {}; for (const k of Object.keys(REMOTE_NAME)) remote[k] = n.feeds[k] === false ? false : due(k) ? true : null;
  S.ui.searching = { phase: 'boards', done: 0, total: boards.length }; render();
  let res;
  try {
    res = await discoverJobs({ prefs: S.prefs, profile: S.profile, weights: S.settings.weights, boards, remote, existing: Object.values(S.jobs), maxNew: 60, onProgress: ev => { S.ui.searching = { ...S.ui.searching, ...ev }; paintSearchProgress(); } });
  } catch (e) { S.ui.searching = null; render(); toast('The search could not finish: ' + ((e && e.message) || e), 'bad'); return null; }

  for (const j of res.fresh) { S.jobs[j.id] = j; save.job(j); }

  for (const k of Object.keys(remote)) if (remote[k] === true && res.stats.remote[k] === 'ok') last[k] = t;
  S.meta = { ...S.meta, remoteAt: last, search: { at: t, stats: res.stats, newIds: res.fresh.map(j => j.id), closedIds: res.closed } }; save.meta();
  logAgent('Job Discovery Agent', 'Searched open roles', `${res.stats.boardsOk}/${res.stats.boards} company boards, ${res.stats.listed} open roles read, ${res.fresh.length} new, ${res.closed.length} closed${res.stats.failed.length ? `, ${res.stats.failed.length} board(s) unreachable` : ''}`);
  S.ui.searching = null; render();
  if (!quiet) toast(res.fresh.length ? `${res.fresh.length} new open role${res.fresh.length === 1 ? '' : 's'} added${res.closed.length ? ` · ${res.closed.length} closed` : ''}.` : `No new matches in ${res.stats.listed.toLocaleString('en-IN')} open roles${res.closed.length ? ` · ${res.closed.length} saved role${res.closed.length === 1 ? '' : 's'} closed` : ''}.`);

}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (S.ui.notifOpen && !e.target.closest('.notif-panel') && !(el && el.dataset.act === 'notifs')) { S.ui.notifOpen = false; render(); if (!el) return; }
  if (!el) return; const act = el.dataset.act;
  if (act === 'modal-bg' && e.target !== el) return;
  const fn = ACT[act]; if (!fn) return;
  if (!el.closest('#modal-root')) window._trigger = el;   // where focus goes back to when a dialog closes
  if (el.tagName === 'A' && !el.getAttribute('href')) e.preventDefault();
  if (el.tagName === 'BUTTON') el.disabled = true;
  try { await fn(el, e); } catch (err) { if (!(err && err.code === 'cancelled')) { console.error(err); toast((err && err.message) || 'Something went wrong.', 'bad'); } }
  finally { if (el.isConnected && el.tagName === 'BUTTON') el.disabled = false; }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fn = FORM[f.dataset.form]; if (!fn) return; const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  try { await fn(f, e); } catch (err) { if (!(err && err.code === 'cancelled')) { console.error(err); toast((err && err.message) || 'Something went wrong.', 'bad'); } }
  finally { if (btn && btn.isConnected) btn.disabled = false; }

  }

  await loadAndEnter();
}
boot();
</script>
